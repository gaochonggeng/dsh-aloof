# dsh bundle patch —— 这个文件就是插件接进 profile 的全部接口。
#
# `dsh plugin add` 装完后，dsh 把本文件当成一个补丁层，追加在 dsh-base /
# dsh-web-app 之后、用户自己的 cordis.patch.yml 之前。想改下面的配置，
# 不要改这里（升级会覆盖）：在 profile 的 cordis.patch.yml 里按 id 覆盖，
# 例如
#
#   - id: aloof
#     name: 'dsh-aloof'
#     config:
#       tokenEnv: ALOOF_TOKEN
#       timeoutMs: 20000
#       requireApproval: true
#
# 注意 patch 是「整块替换 config」而不是深合并：覆盖时要把键写全。
#
# **这里没有 baseUrl，这是故意的。** 地址跟着票一起来——Aloof 复制给你的是
# `alf_xxxx@https://你那台` 一整串，插件从 @ 切开，前半截当密钥、后半截当地址。
# 要是这个文件兜一个具体域名，装完没改的人的令牌就会发到那个域名去（那边只会回
# 401，但票已经出网了）。只有反向代理 / 内网另有入口、网页地址和 dsh 能到达的地址
# 确实不是同一个时，才在上面那段覆盖里补一行 baseUrl，填了以它为准。
- insert:
    - id: aloof
      name: 'dsh-aloof'
      config:
        # 接入令牌从哪个凭据引用取。配置里存的是**引用名**，不是令牌本身：
        # 值交给 dsh 的 credentials provider（进程环境变量 / $DSH_HOME/.credentials.yaml），
        # 这样这份配置可以随便同步、随便渲染到界面上，换令牌也不用碰配置文件。
        tokenEnv: ALOOF_TOKEN
        # 单次 HTTP 超时（毫秒）。
        timeoutMs: 20000
        # 写操作（写 / 删资料库内容、发起审批、同意 / 驳回）是否必须先问人。
        # true = fail closed：没有可用的审批答复方就直接拒绝，不会静默放行。
        requireApproval: true
